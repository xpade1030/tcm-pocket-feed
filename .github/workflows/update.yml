name: Update feeds

on:
  schedule:
    - cron: "0 22 * * *"   # 每天台灣時間 06:00
    - cron: "0 5 * * *"    # 每天台灣時間 13:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安裝工具（Claude Code CLI、pdftotext）
        run: |
          npm install -g @anthropic-ai/claude-code
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: 驗證 Claude 登入（僅手動觸發時）
        if: github.event_name == 'workflow_dispatch'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "請只回覆 OK 兩個字" | claude -p --model haiku --max-turns 1 --tools ""
      - name: 抓取全聯會公告
        run: python scripts/fetch_twtm.py > raw/run.log 2>&1 || (cat raw/run.log; exit 1)
      - name: AI 整理新公告與年度計畫比對
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "未設定 CLAUDE_CODE_OAUTH_TOKEN，跳過 AI 整理"; exit 0; fi
          python scripts/plan_diffs_all.py
          python scripts/enrich.py --limit 40
          tail -2 raw/enrich-log.txt || true
      - name: 有變動才提交
        run: |
          tail -3 raw/run.log
          git config user.name "tcm-pocket-feed bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs raw
          git diff --cached --quiet && echo "沒有新公告" || (git commit -m "更新公告 $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
